# /etc/nginx/sites-available/payhas-api
# Reverse-proxy from awtofon.com.tm/api/* (or a dedicated subdomain)
# to the local kestrel on 127.0.0.1:5050.
#
# Activate:
#   sudo ln -s /etc/nginx/sites-available/payhas-api /etc/nginx/sites-enabled/payhas-api
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name api.awtofon.com.tm;

    location / {
        proxy_pass         http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        client_max_body_size 50m;
        proxy_read_timeout   120s;
    }
}
